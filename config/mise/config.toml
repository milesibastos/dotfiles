[tools]
codex = "latest"
go = "latest"
node = "24"
"npm:prettier" = "latest"
opencode = "latest"
python = "3.11"
uv = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node"]
# gh stores its token in the macOS keyring, so hosts.yml is empty and mise's
# gh_cli_tokens lookup finds nothing -> unauthenticated GitHub API -> 403 at 60 req/h.
github.credential_command = "gh auth token"
# opt out of mise 2026.8.x's 24h default hold on fresh releases
minimum_release_age = "0s"
